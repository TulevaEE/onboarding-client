<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      The partner handover token is a login credential that carries the person's identity. It has to
      leave the address before any other script runs, because the Meta Pixel, Tag Manager and Sentry
      all report the page address. The app reads it from sessionStorage (TriggerProcedure).
    -->
    <script>
      (function () {
        try {
          var address = window.location;
          var token = /[?&]handoverToken=([^&#]*)/.exec(address.search);
          if (address.pathname.indexOf('/trigger-procedure') !== 0 || !token) {
            return;
          }
          window.sessionStorage.setItem('handoverToken', decodeURIComponent(token[1].replace(/\+/g, ' ')));
          var search = address.search.replace(/([?&])handoverToken=[^&#]*(&|$)/, '$1').replace(/[?&]$/, '');
          window.history.replaceState(window.history.state, '', address.pathname + search + address.hash);
        } catch (error) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#00aeea">
    <!--
      This host is the application, not the public site: tuleva.ee is what belongs in a search
      index. A gift URL carries a token that names a child, so it must never be indexed. The ban
      lives here rather than in robots.txt on purpose: a crawler has to fetch the page to see it,
      and a robots.txt that keeps crawlers out would also keep out the ones that build the link
      preview shown when somebody shares a gift link in a chat.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:image" content="https://tuleva.ee/wp-content/uploads/2018/11/account_1.png" />
    <meta property="og:title" content="Vaheta pensionifond tasuta otse telefonis" />
    <meta property="og:description" content="Sisene ID-kaardi, mobiil-ID või smart-ID abil." />


    <!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32">
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png">

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">
    <meta name="apple-mobile-web-app-title" content="Tuleva">
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Tuleva</title>
    <!-- Facebook Pixel Code -->
<script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  // A PageView reports the URL, and a gift URL carries a token that names a child.
  if (!/^\/kingitus(\/|$)/.test(window.location.pathname)) {
    fbq('init', '264307013931375');
    fbq('track', 'PageView');
  }
</script>
<script type="text/javascript" src="https://inaadress.maaamet.ee/inaadress/js/inaadress.min.js?d=20220510"></script>

/></noscript>
